<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employees List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="mt-5">

<div class="container">
    <h1 class="text-center mb-4">Employees</h1>

    <div class="text-center mb-3">
        <a class="btn btn-primary" href="/api/employee/add">Add Employee</a>
    </div>

    <div style="overflow-x: auto; white-space: nowrap;">
        <table class="table table-bordered table-striped">
            <thead class="table-dark text-center">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Start Date</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Temporary Password</th>
                    <th>Location</th>
                    <th>Operating System</th>
                    <th>Mentor</th>
                    <th>HR Manager</th>
                    <th>IT Administrator</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.id}"></td>
                <td th:text="${employee.name}"></td>
                <td th:text="${employee.position}"></td>
                <td th:text="${employee.startDate}"></td>
                <td th:text="${employee.userAccount.username}"></td>
                <td th:text="${employee.userAccount.email}"></td>
                <td th:text="${employee.userAccount.temporaryPassword}"></td>
                <td th:text="${employee.workstation.location}"></td>
                <td th:text="${employee.workstation.operatingSystem}"></td>
                <td th:text="${employee.mentor != null ? employee.mentor.name : ''}"></td>
                <td th:text="${employee.hrManager.name}"></td>
                <td th:text="${employee.itAdministrator.name}"></td>
                <td>
                    <a th:href="@{'/api/employee/edit/' + ${employee.id}}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{'/api/employee/delete/' + ${employee.id}}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this employee?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
