<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 th:text="(${employee.id} == null) ? 'Add Employee' : 'Edit Employee'" class="mb-4"></h1>

<form th:action="@{/api/employee/save}" th:object="${employee}" method="post" class="row g-3">
    <input type="hidden" th:field="*{id}" />

    <div class="border rounded p-3 mb-4 bg-light">
        <h5 class="mb-3">Employee Data</h5>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" required />
            </div>
            <div class="col-md-4">
                <label class="form-label">Position</label>
                <input type="text" th:field="*{position}" class="form-control" required />
            </div>
            <div class="col-md-4">
                <label class="form-label">Start Date</label>
                <input type="date" th:field="*{startDate}" class="form-control" required />
            </div>
        </div>
    </div>

    <div class="border rounded p-3 mb-4 bg-light">
        <h5 class="mb-3">User Account Data</h5>
        <input type="hidden" th:field="*{userAccount.id}" />
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">Username</label>
                <input type="text" th:field="*{userAccount.username}" class="form-control" required />
            </div>
            <div class="col-md-4">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{userAccount.email}" class="form-control" required />
            </div>
            <div class="col-md-4">
                <label class="form-label">Temporary Password</label>
                <input type="text" th:field="*{userAccount.temporaryPassword}" class="form-control" required />
            </div>
        </div>
    </div>

    <div class="border rounded p-3 mb-4 bg-light">
        <h5 class="mb-3">Mentor Data</h5>
        <input type="hidden" th:field="*{mentor.id}" />
        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{mentor.name}" class="form-control" required />
            </div>
            <div class="col-md-6">
                <label class="form-label">Department</label>
                <input type="text" th:field="*{mentor.department}" class="form-control" required />
            </div>
        </div>
    </div>

    <div class="border rounded p-3 mb-4 bg-light">
        <h5 class="mb-3">Workstation Data</h5>
        <input type="hidden" th:field="*{workstation.id}" />
        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Location</label>
                <input type="text" th:field="*{workstation.location}" class="form-control" required />
            </div>
            <div class="col-md-6">
                <label class="form-label">Operating System</label>
                <input type="text" th:field="*{workstation.operatingSystem}" class="form-control" required />
            </div>
        </div>
    </div>

    <div class="border rounded p-3 mb-4 bg-light">
        <h5 class="mb-3">HR Manager</h5>
        <div class="row">
            <div class="col-md-6">
                <select th:field="*{hrManager.id}" class="form-select">
                    <option th:each="hr : ${hrManagers}" th:value="${hr.id}" th:text="${hr.name}"></option>
                </select>
            </div>
        </div>
    </div>

    <div class="border rounded p-3 mb-4 bg-light">
        <h5 class="mb-3">IT Administrator</h5>
        <div class="row">
            <div class="col-md-6">
                <select th:field="*{itAdministrator.id}" class="form-select">
                    <option th:each="it : ${itAdministrators}" th:value="${it.id}" th:text="${it.name}"></option>
                </select>
            </div>
        </div>
    </div>

    <div class="col-12">
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/" class="btn btn-secondary">Cancel</a>
    </div>
</form>
</body>
</html>
